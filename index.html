<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>TESDA Forms Library - Secure Access</title>
  <link rel="preconnect" href="https://zlilrvqbkshefyhvauml.supabase.co" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- AUTHENTICATION OVERLAY -->
  <div id="login-overlay">
    <div class="login-card">
      <div class="tab-header">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Log In</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Register</button>
      </div>

      <!-- LOGIN TAB -->
      <div id="form-login">
        <h2>Restricted Access</h2>
        <p class="login-description">Enter your registered username and invite code.</p>
        <input type="text" id="loginUsername" placeholder="Enter username...">
        <input type="text" id="loginCode" placeholder="Enter invite code...">
        <button id="loginBtn" onclick="handleLogin()">Access Library</button>
      </div>

      <!-- REGISTER TAB -->
      <div id="form-register" style="display: none;">
        <h2>Create Account</h2>
        <p class="login-description">Register using a valid friend's invite code.</p>
        <input type="text" id="regUsername" placeholder="Choose a username...">
        <input type="text" id="regCode" placeholder="Enter single-use invite code...">
        <button id="regBtn" onclick="handleRegister()">Register & Log In</button>
      </div>

      <div id="error-msg"></div>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-container">
    <header>
      <div class="header-content">
        <p class="eyebrow">Document library</p>
        <h1>TESDA Forms</h1>
        <p>Choose a folder below to open its forms.</p>
      </div>
    </header>
    <main>
      <div class="referral-panel">
        <h3>Your Referral Status</h3>
        <p id="user-status-text">Logged in successfully.</p>
        <div id="invite-box"></div>
        <button id="gen-btn" onclick="generateInvite()">Generate My One-Time Invite Code</button>
        <button id="logout-btn" class="logout-btn" onclick="handleLogout()">Log Out</button>
      </div>

      <div class="section-heading">
        <h2>Choose a folder</h2>
        <span class="count">8 folders</span>
      </div>

      <!-- Dynamic injection target for protected content -->
      <div id="folder-grid-container"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
